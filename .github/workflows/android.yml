name: Virtual Arena Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
    
      - name: Fetch pinned Shelter source
        run: |
          git clone https://github.com/PeterCxy/Shelter.git upstream
          cd upstream
          git checkout --detach 0afac87b2dc34e58652d6bb3cebb61b1baaf1b98
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "0afac87b2dc34e58652d6bb3cebb61b1baaf1b98"
      - name: Apply Virtual Arena adaptations
        run: python3 scripts/brand.py
      - name: Build installable debug APK
        run: |
          cd upstream
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Virtual-Arena-v1.0.0-debug-APK
          path: upstream/app/build/outputs/apk/debug/*.apk
