name: Virtual Arena Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Fetch licensed Shelter base
        run: git clone --depth 1 https://github.com/PeterCxy/Shelter.git upstream
      - name: Apply Virtual Arena adaptations
        run: python3 scripts/brand.py
      - name: Build installable debug APK
        run: |
          cd upstream
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Virtual-Arena-v1.0.0-debug-APK
          path: upstream/app/build/outputs/apk/debug/*.apk
